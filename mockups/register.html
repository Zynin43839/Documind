<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | DocuMind</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="register-title">
        <a class="brand" href="login.html" aria-label="DocuMind home">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="4" width="10" height="9" rx="2"/><rect x="19" y="4" width="10" height="9" rx="2"/><rect x="11" y="20" width="10" height="9" rx="2"/><path d="M13 8.5h6M8 13v7m16-7v7m-11 4.5h6"/></svg></span>
          <span>DocuMind</span>
        </a>
        <div class="auth-intro">
          <p class="eyebrow">DOCUMENTATION INTELLIGENCE</p>
          <h1 id="register-title">Create your account</h1>
          <p>Start asking grounded questions across your team's documentation.</p>
        </div>
        <form class="sign-in-form" action="#" method="post">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Alex Rivera">
          </div>
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com">
          </div>
          <div class="field">
            <div class="label-row"><label for="password">Password</label><span class="field-meta">Required</span></div>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" aria-describedby="password-help">
              <button class="icon-button password-toggle" type="button" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696C3.423 7.636 7.362 5 12 5c4.637 0 8.575 2.636 9.938 6.652a1 1 0 0 1 0 .696C20.575 16.364 16.637 19 12 19c-4.638 0-8.577-2.636-9.938-6.652Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
            </div>
            <p id="password-help" class="field-help">Use at least 8 characters.</p>
          </div>
          <button class="button button-primary submit-button" type="submit">Create account <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      </section>
    </main>
    <script>
      document.querySelector(".password-toggle").addEventListener("click", (event) => {
        const button = event.currentTarget;
        const input = document.querySelector("#password");
        const isVisible = input.type === "text";

        input.type = isVisible ? "password" : "text";
        button.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
        button.title = isVisible ? "Show password" : "Hide password";
      });
    </script>
  </body>
</html>
