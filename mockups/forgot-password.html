<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | DocuMind</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="reset-password-title">
        <a class="brand" href="login.html" aria-label="DocuMind home">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="4" width="10" height="9" rx="2"/><rect x="19" y="4" width="10" height="9" rx="2"/><rect x="11" y="20" width="10" height="9" rx="2"/><path d="M13 8.5h6M8 13v7m16-7v7m-11 4.5h6"/></svg></span>
          <span>DocuMind</span>
        </a>
        <div class="auth-intro">
          <p class="eyebrow">ACCOUNT RECOVERY</p>
          <h1 id="reset-password-title">Reset your password</h1>
          <p>Enter your work email and we'll send a link to reset your password.</p>
        </div>
        <form class="sign-in-form" action="#" method="post">
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" aria-describedby="email-help" required>
            <p id="email-help" class="field-help">Use the email associated with your workspace.</p>
          </div>
          <button class="button button-primary submit-button" type="submit">Send reset link <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></button>
        </form>
        <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
        <p class="security-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Reset links expire after 60 minutes</p>
      </section>
    </main>
  </body>
</html>
