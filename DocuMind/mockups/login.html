<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | DocuMind</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <a class="brand" href="login.html" aria-label="DocuMind home">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="4" width="10" height="9" rx="2"/><rect x="19" y="4" width="10" height="9" rx="2"/><rect x="11" y="20" width="10" height="9" rx="2"/><path d="M13 8.5h6M8 13v7m16-7v7m-11 4.5h6"/></svg></span>
          <span>DocuMind</span>
        </a>
        <div class="auth-intro">
          <p class="eyebrow">DOCUMENTATION INTELLIGENCE</p>
          <h1 id="login-title">Welcome back</h1>
          <p>Sign in to ask grounded questions across your team's indexed documentation.</p>
        </div>
        <form class="sign-in-form" action="#" method="post">
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" aria-describedby="email-help">
            <p id="email-help" class="field-help">Use the email associated with your workspace.</p>
          </div>
          <div class="field">
            <div class="label-row"><label for="password">Password</label><span class="field-meta">Required</span></div>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="password-help">
              <button class="icon-button password-toggle" type="button" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-5.5 9.5-5.5S21.5 12 21.5 12 18.2 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
            </div>
            <p id="password-help" class="field-help">Your account password is never shared with sources.</p>
          </div>
          <button class="button button-primary submit-button" type="submit">Sign in <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></button>
        </form>
        <p class="security-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Secure access to your documentation workspace</p>
      </section>
    </main>
  </body>
</html>
